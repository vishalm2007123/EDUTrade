{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🛡️</div>
      <h1>Admin Login</h1>
      <p>Secure access for platform administrators</p>
    </div>
    <div class="card" style="border-color:#f59e0b;border-width:2px;">
      <form method="POST" action="{{ url_for('admin_login') }}">
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <input type="email" name="email" class="form-control" placeholder="admin@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-accent btn-block btn-lg">Login as Admin</button>
        <p class="auth-switch" style="text-align:center;margin-top:16px;font-size:13px;">
          No admin account? <a href="{{ url_for('admin_register') }}">Create one</a>
        </p>
      </form>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-secondary);">
      <a href="{{ url_for('index') }}">← Back to EduSwap</a>
    </p>
  </div>
</div>
{% endblock %}
