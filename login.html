{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container page-content">
  <div style="max-width:460px;margin:0 auto;">

    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:40px;margin-bottom:12px;">👋</div>
      <h1 style="font-size:26px;font-weight:700;letter-spacing:-0.5px;">Welcome back</h1>
      <p style="color:var(--text-secondary);font-size:14px;margin-top:6px;">Log in to access your skills and Community Coins</p>
    </div>

    <div class="card">
      <form method="POST" action="{{ url_for('login') }}">

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>

        <p style="text-align:center;font-size:13px;color:var(--text-secondary);margin-top:16px;">
          New to EduSwap? <a href="{{ url_for('register') }}">Create a free account</a>
        </p>

      </form>
    </div>

  </div>
</div>
{% endblock %}
