{% extends "base.html" %}
{% block title %}Admin Register{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🛡️</div>
      <h1>Create Admin Account</h1>
      <p>Requires the platform secret key</p>
    </div>
    <div class="card" style="border-color:#f59e0b;border-width:2px;">
      <form method="POST" action="{{ url_for('admin_register') }}">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Admin Name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Secret Key</label>
          <input type="password" name="secret_key" class="form-control" placeholder="Platform secret key" required>
          <div class="form-hint">Contact the platform owner for the secret key. Demo: <code>EDUSWAP_ADMIN_2025</code></div>
        </div>
        <button type="submit" class="btn btn-accent btn-block btn-lg">Create Admin Account</button>
        <p class="auth-switch"><a href="{{ url_for('admin_login') }}">← Back to admin login</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
